  <script>
  (() => {
    'use strict';
    const SAVE_KEY = 'aiba-manager-note-v1-current';
    const $ = id => document.getElementById(id);
    const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const clone = obj => JSON.parse(JSON.stringify(obj));
    const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
    const STAT_KEYS = ['work','trust','team','guest'];
    const STAT_NAMES = ['工作能力','相叶桑信赖度','节目组评价','嘉宾关系'];
    const SHORT_NAMES = ['能力','信赖','节目组','嘉宾'];
    const PORTRAIT_SOURCES = [
      'https://ikimonoworld.jp/asset/images/guide/aib.png',
      'https://web.familyclub.jp/images/53/ca3/8069ad1cecc4ec62fdd93bc703c9f.jpg'
    ];
    const SCENE_PHOTOS = {
      desk:{name:'行程与心意',kicker:'清晨 · 工作准备',caption:'把今天的第一件事，认真做好。',alt:'晨光下的工作桌、笔记本与包装好的礼物'},
      studio:{name:'录制现场',kicker:'电视台 · 镜头之后',caption:'灯光亮起，一起接住每个意外。',alt:'安静的电视演播厅与前景中的广播摄像机'},
      cafe:{name:'窗边咖啡',kicker:'午休 · 咖啡店',caption:'一杯咖啡的时间，一起想想办法。',alt:'窗边木桌上的两杯咖啡与打开的笔记本'},
      forest:{name:'户外观察',kicker:'午后 · 开放观察区',caption:'换一种路线，也能看见新的发现。',alt:'阳光穿过绿叶，照在林间的木质观察步道上'}
    };
    const portraitFailed = new Set();
    function photoKeyFor(s){
      if(s.scene==='ending'||['c3_field','c3_wrap','c3_debrief'].includes(s.scene))return 'forest';
      if(scenes[s.scene].chapter===1)return 'desk';
      if(scenes[s.scene].chapter===2)return 'studio';
      if(s.flags.coffee==='office'&&['c3_break','c3_route'].includes(s.scene))return 'studio';
      return 'cafe';
    }
    function portraitMarkup(){
      const src=PORTRAIT_SOURCES.find(url=>!portraitFailed.has(url));
      return '<span class="speaker-mark portrait-avatar'+(src?'':' portrait-unavailable')+'" aria-hidden="true"><span>相</span>'+(src?'<img data-portrait="aiba" src="'+esc(src)+'" alt="" width="72" height="72" decoding="async" referrerpolicy="no-referrer">':'')+'</span>';
    }
    function renderPhoto(s){
      const key=photoKeyFor(s),photo=SCENE_PHOTOS[key];
      return '<figure class="scene-photo"><div class="photo-cell photo-'+key+'" role="img" aria-label="'+photo.alt+'；AI 场景配图"></div><button class="photo-expand" data-action="view-photo" data-photo="'+key+'" aria-label="放大'+photo.name+'配图">查看配图</button><figcaption><span class="photo-kicker">'+photo.kicker+'</span><div class="photo-caption-row"><b class="photo-title">'+photo.caption+'</b><small class="ai-badge">AI 场景配图</small></div></figcaption></figure>';
    }
    const CHAPTERS = [
      {name:'行程与心意',short:'行程与心意',start:'c1_schedule',summary:'一天从行程确认与礼物准备开始。你要在拍摄安排、休息时间和人情往来之间，找到自己的工作节奏。'},
      {name:'录制现场的意外',short:'录制现场的意外',start:'c2_meet',summary:'嘉宾佐藤悠真带着动物插画册来到电视台。动物环节的突发状况、赠礼是否公开，以及一道没有唯一答案的争议题，都需要你在现场作出判断。'},
      {name:'午休时间的小插曲',short:'午休的小插曲',start:'c3_route',summary:'午休时分，原定户外观察路线局部关闭，拍摄时间也被压缩。精简流程、嘉宾主导、观察任务或资源协调，四种方向会把下午带往不同的现场。'}
    ];
    const NUM = ['一','二','三'];
    const p = text => ({type:'p',text});
    const d = (who,text) => ({type:'d',who,text});
    const note = (title,items) => ({type:'note',title,items});
    const msg = (who,time,text) => ({type:'message',who,time,text});
    const choice = (title,desc,tag,next,effects,set,result,add) => ({title,desc,tag,next,effects:effects||[0,0,0,0],set:set||{},result:result||'',add:add||{}});

      schedule:'none',giftPrep:'none',greeting:'none',crisis:'none',giftMode:'pending',quiz:'none',coffee:'none',
      route:'none',plan:'none',field:'none',closure:'none',debrief:'none',quality:0,pressure:0
    };
    function fresh(start='c1_schedule') {
      const s = {version:1,scene:start,stats:{work:45,trust:48,team:48,guest:40},flags:clone(flagDefaults)};
      if(start==='c2_meet') s.stats = {work:57,trust:60,team:57,guest:40};
      if(start==='c3_route') {s.stats={work:70,trust:75,team:72,guest:68};s.flags.coffee='cafe';}
      return s;
    }
    const scenes = {
      c1_schedule:{chapter:1,progress:4,time:'08:00',place:'事务所 · 工作桌前',title:'把忙碌的一天，安排得从容一点。',subtitle:'第一章 · 行程与心意',task:'确认行程与休息时间',body:s=>[
        p('你是相叶雅纪在这个平行世界里的经纪人。今天上午有电视节目录制，下午还有与动物有关的户外企划。桌上的流程表还没翻完，手机已经亮了起来。'),
        msg('制作组','08:00','上午先在电视台会合，下午转场拍摄。请提前确认出发时间、录制安排和休息空档。'),
        d('相叶','早上好！今天也拜托你啦。对了，我们中午有时间好好吃饭吧？哈哈哈。'),
        p('你在流程表上落下第一笔。今天的工作方式，就从这一刻开始。')
      ],question:'你准备怎样安排行程？',choices:()=>[
        choice('先核对全日流程','确认录制、交通与转场，给每个环节留出缓冲。','稳妥执行 · 时间管理','c1_gift',[7,2,5,0],{schedule:'buffer'},'你把转场与休息写进正式流程，制作组确认了各个时间点。'),
        choice('先确认相叶桑的状态','听听他的体力与用餐需求，再和制作组调整顺序。','照顾状态 · 建立默契','c1_gift',[3,7,2,0],{schedule:'rest'},'相叶桑认真看了看新的休息空档，笑着说这下可以安心开工了。'),
        choice('和制作组一起排优先级','把必须拍到的内容列出来，共同确定可调整的部分。','团队沟通 · 共同判断','c1_gift',[5,2,7,0],{schedule:'team'},'制作组和你约定了调整流程时的联络人，临时变化有了明确的沟通路径。'),
        choice('先照旧表出发','沿用原来的时间表，路上再补充细节。','快速出发 · 缓冲较少','c1_gift',[0,1,-3,0],{schedule:'tight'},'你们及时出发了，但转场与休息还缺少确认，后面需要补上。',{pressure:1})
      ]},
      c1_gift:{chapter:1,progress:11,time:'08:25',place:'事务所 · 出发前',title:'小小的心意，也需要合适的安排。',subtitle:'工作之外，还有一件待办。',task:'准备礼物与交接事项',body:s=>[
        p(s.flags.schedule==='rest'?'你把午休空档圈了起来，接着检查随身物品。':'流程表暂时整理妥当。出发前，你再次核对今天的物品清单。'),
        p('你准备了一份简单的小礼物，想在合适的时候交给相叶桑。接待清单上也留着“嘉宾礼物交接”一栏——你还不知道嘉宾是否会带来什么特别的心意。'),
        note('礼物准备单',['包装与便笺是否齐全','先确认本人意愿，再决定是否公开','安排交接时间，避免打断工作']),
        p('一份礼物不需要抢镜，但也不该在忙碌里被遗忘。')
      ],question:'这份准备，你会怎样完成？',choices:()=>[
        choice('仔细核对，再妥善收好','检查包装与收礼人，把交接时间记进清单。','细致准备 · 可靠交接','c1_depart',[6,3,3,0],{giftPrep:'checked'},'礼物与物品清单一一对应，你也预留了不打扰录制的交接时间。'),
        choice('添上一张手写便笺','写下“今天也辛苦了”，等他有空时再送。','真诚表达 · 适度心意','c1_depart',[2,7,0,0],{giftPrep:'note'},'你写好便笺，将这份小小的心意和工作资料分开放好。'),
        choice('请同事协助，自己复核','用一份简短清单说明包装、保管与交接要求。','明确分工 · 协作准备','c1_depart',[4,2,6,0],{giftPrep:'delegated'},'同事完成准备后，你做了最后核对。谁负责保管、何时交接，都说清楚了。'),
        choice('先忙出发，礼物稍后再说','不再检查包装和时间，留到现场处理。','节省眼前时间 · 留有遗漏','c1_depart',[-2,-2,-1,0],{giftPrep:'late'},'礼物被放进随身袋，你提醒自己到了现场务必再检查一次。')
      ]},
      c1_depart:{chapter:1,progress:18,time:'09:10',place:'前往电视台',title:'你的第一张流程表，开始派上用场。',subtitle:'准备告一段落，真正的现场就在前面。',task:'抵达电视台与嘉宾会合',body:s=>[
        p(s.flags.schedule==='tight'?'车上，你补发了转场与休息确认消息。制作组答应到场后一起核对，但原本的机动时间已经用掉了一部分。':'制作组回传了确认后的安排。你收起手机，终于有时间把上午的流程再看一遍。'),
        d('相叶','今天的嘉宾是佐藤君吧？听说他很喜欢动物。感觉会是有趣的一天！'),
        p(s.flags.giftPrep==='note'?'等他看完资料，你把附着便笺的小礼物递过去。他低头读了一遍，郑重地说了声谢谢。':s.flags.giftPrep==='late'?'到电视台后，你重新整理了礼物。包装虽有些仓促，好在你记得先问相叶桑是否方便收下。':'趁着等候的空档，你确认相叶桑方便收下礼物，完成了这项小小的交接。'),
        d('相叶','谢谢你！好，那今天也一起加油吧。'),
        note('第一章完成',['行程已确认，后续仍可视现场情况调整','礼物准备与交接已完成','下一站：电视台休息室，认识今天的嘉宾'])
      ],choices:()=>[choice('进入第二章','录制现场的意外。','', 'c2_meet')]},
      c2_meet:{chapter:2,progress:24,time:'10:00',place:'电视台 · 嘉宾休息室',title:'一位新嘉宾，和一本还没公开的小册子。',subtitle:'第二章 · 录制现场的意外',task:'接待嘉宾佐藤悠真',body:()=>[
        p('休息室的门被轻轻敲响。今天的嘉宾佐藤悠真抱着资料走进来，神情有些紧张。'),
        d('佐藤','初次见面，请多关照。我很喜欢动物，也参加过一些动物保护志愿活动。'),
        p('他带来了一本亲手绘制的动物插画小册子，想在录制结束后送给相叶桑。你先把这项私下赠礼记作待沟通事项，没有放进公开流程。'),
        d('相叶','佐藤君，今天一起玩得开心一点吧！你可不要出太难的题哦，哈哈哈。'),
        p('正式开机之前，你还有一点时间帮助两人进入状态。')
      ],question:'你会怎样开启这次合作？',choices:()=>[
        choice('聊聊他的志愿经历','先听他想分享什么，再向相叶桑介绍。','认真倾听 · 嘉宾关系','c2_crisis',[2,3,2,8],{greeting:'listen'},'佐藤逐渐放松，谈起自己观察动物时的习惯。相叶桑在一旁听得很认真。'),
        choice('一起快速走一遍流程','把规则、休息点和需要确认的内容说明白。','工作清晰 · 减轻紧张','c2_crisis',[5,2,6,3],{greeting:'brief'},'两人对流程有了共同认识，佐藤也知道有疑问时可以随时找你。'),
        choice('让两人先自由交流','你在旁边协调准备，给他们留一点认识的空间。','自然互动 · 建立气氛','c2_crisis',[1,5,2,5],{greeting:'natural'},'两人很快聊起动物纪录片，休息室里的气氛轻松下来。'),
        choice('先把所有提醒一次讲完','用短时间交代尽可能多的信息，再去处理现场。','信息集中 · 需要消化','c2_crisis',[1,0,2,-3],{greeting:'rushed'},'佐藤点头记下提醒，但略显拘谨。你意识到稍后需要再给他一点提问的时间。')
      ]},
      c2_crisis:{chapter:2,progress:31,time:'10:15',place:'电视台 · 录制准备区',title:'原定的动物环节，临时出了状况。',subtitle:'开机前，第一份临场判断。',task:'协调动物环节的临时调整',body:()=>[
        msg('现场工作人员','10:15','原定的动物互动暂时无法按计划进行，照护人员需要先确认动物状态。导演正在等替代方案。'),
        p('流程表上的一整段内容突然空了下来。相叶桑先问了动物的情况，佐藤也放下资料，认真听工作人员说明。'),
        d('相叶','先让它好好休息吧。我们可以做别的内容，没关系的。'),
        p('能不能继续原环节，要由照护人员判断；而等待的时间怎么安排，是你的工作。')
      ],question:'怎样接住这个临时空档？',choices:()=>[
        choice('先确认状态，启用备用访谈','请照护人员专心处理，安排两人聊动物经历。','照顾现场 · 启用备用','c2_consent',[6,6,4,3],{crisis:'care'},'动物环节暂停，由照护人员继续确认状态。你用准备好的经历访谈接住了空档。'),
        choice('和导演协商，先录知识挑战','调整录制顺序，让已经准备好的环节先上。','顺序调整 · 保持节奏','c2_consent',[7,3,7,2],{crisis:'reorder'},'导演确认先录动物知识挑战，制作组重新标注了机位和流程。'),
        choice('征求两人的意见，再做替代','用各自的观察经验，组合一个不接触动物的短环节。','共同策划 · 自然互动','c2_consent',[4,5,3,7],{crisis:'ideas'},'两人各分享一段观察经历，临时内容有了真诚的互动。你把调整同步给导演。',{quality:1}),
        choice('先等一等，看看能否照原计划','暂不提交替代方案，等待照护人员的最终回复。','保留原案 · 时间消耗','c2_consent',[-3,0,-5,0],{crisis:'wait'},'照护人员仍建议休息，原环节不能继续。导演临时改录问答，留给准备的时间更少了。',{pressure:1})
      ]},
      c2_consent:{chapter:2,progress:38,time:'10:27',place:'电视台 · 休息室',title:'把一份心意放进镜头，需要先问谁？',subtitle:'动物环节已调整，新的提议又到了。',task:'确认赠礼是否公开',body:s=>[
        p(s.flags.crisis==='wait'?'你补齐了刚才的流程调整。制作人看见佐藤手里的小册子，忽然提出了一个想法。':'调整后的录制安排获得确认。你刚回到休息室，制作人便叫住了你。'),
        d('制作人','那本动物插画册很有意思。不如安排在节目最后送给相叶先生？应该会是个温馨的环节。'),
        p('这本小册子原本打算私下赠送。佐藤还没有答应公开，镜头前的表达也未必是他期待的样子。'),
        d('相叶','礼物的事，还是听听佐藤君自己的想法吧。')

    function getValue(value,s) {return typeof value==='function'?value(s):value;}
    function available(s) {return scenes[s.scene].choices?scenes[s.scene].choices(s):[];}
    function advance(s,index) {
      const c=available(s)[index];
      if(!c) throw new Error('无效选项');
      const next=clone(s),delta={};
      STAT_KEYS.forEach((key,i)=>{next.stats[key]=clamp(next.stats[key]+c.effects[i]);delta[key]=next.stats[key]-s.stats[key];});
      Object.assign(next.flags,c.set);
      Object.keys(c.add).forEach(key=>{next.flags[key]+=c.add[key];});
      next.scene=getValue(c.next,next);
      if(!scenes[next.scene]) throw new Error('未找到后续场景');
      return {state:next,feedback:{text:c.result,delta}};
    }

    const flagEnums = {

      greeting:['none','listen','brief','natural','rushed'],crisis:['none','care','reorder','ideas','wait'],

    function validateSave(data) {
      if(!data||data.game!=='aiba-manager-note'||data.version!==1) throw new Error('这不是本游戏支持的存档。');
      const raw=data.state;
      if(!raw||raw.version!==1||typeof raw.scene!=='string'||!Object.hasOwn(scenes,raw.scene)||!raw.stats||!raw.flags) throw new Error('存档内容不完整。');
      const s=fresh();s.scene=raw.scene;
      STAT_KEYS.forEach(key=>{const n=raw.stats[key];if(!Number.isInteger(n)||n<0||n>100)throw new Error('存档中的状态数值无效。');s.stats[key]=n;});
      Object.keys(flagEnums).forEach(key=>{if(!flagEnums[key].includes(raw.flags[key]))throw new Error('存档中的剧情状态无效。');s.flags[key]=raw.flags[key];});
      ['quality','pressure'].forEach(key=>{const n=raw.flags[key];if(!Number.isInteger(n)||n< -10||n>30)throw new Error('存档中的进度状态无效。');s.flags[key]=n;});
      const scene=scenes[s.scene];
      const routeByScene={c3_compact:'A',c3_guide:'B',c3_tasks:'C',c3_resources:'D'};
      if(routeByScene[s.scene]&&s.flags.route!==routeByScene[s.scene])throw new Error('存档的场景与企划不一致。');
      if(scene.progress>=83&&(s.flags.route==='none'||s.flags.plan==='none'))throw new Error('存档缺少本章的企划状态。');
      if(scene.progress>=91&&s.flags.field==='none')throw new Error('存档缺少现场处理结果。');
      if(scene.progress>=96&&s.flags.closure==='none')throw new Error('存档缺少收尾安排。');
      if(s.scene==='ending'&&s.flags.debrief==='none')throw new Error('存档缺少最终交接。');
      return s;
    }
    let state=fresh(),feedback=null,saved=null,toastTimer=null,transitioning=false,lastFocus=null,pendingImport=null;

    function level(key,n) {
      const levels=key==='work'?['需要积累','进入状态','稳步提升','从容可靠']:key==='trust'?['仍在熟悉','渐有默契','较为信赖','安心托付']:key==='team'?['需要磨合','配合顺畅','可靠的协调者','现场应变优秀']:['有待熟悉','逐渐放松','友好合作','充分信任'];
      return levels[n>=85?3:n>=68?2:n>=48?1:0];
    }
    function renderBlock(b) {
      if(b.type==='p')return '<p>'+esc(b.text)+'</p>';
      if(b.type==='d'){
        const kind=b.who==='佐藤'?'guest':b.who==='你'?'self':['制作人','导演','工作人员'].includes(b.who)?'crew':'aiba';
        const mark=b.who==='相叶'?'相':b.who==='佐藤'?'佐':b.who==='你'?'你':'制';
        return '<div class="dialogue '+kind+'">'+(b.who==='相叶'?portraitMarkup():'<span class="speaker-mark" aria-hidden="true">'+mark+'</span>')+'<div class="dialogue-content"><span class="speaker">'+esc(b.who==='相叶'?'相叶雅纪':b.who==='佐藤'?'佐藤悠真':b.who)+'</span><p>「'+esc(b.text)+'」</p></div></div>';
      }
      if(b.type==='message')return '<aside class="message"><div class="message-head"><span>'+esc(b.who)+'</span><time>'+esc(b.time)+'</time></div><p>'+esc(b.text)+'</p></aside>';
      if(b.type==='note')return '<aside class="note"><h3>'+esc(b.title)+'</h3><ul>'+b.items.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul></aside>';
      return '';

    function renderFeedback() {
      if(!feedback||!feedback.text)return '';
      const deltas=STAT_KEYS.map((key,i)=>feedback.delta[key]?'<span'+(feedback.delta[key]<0?' class="negative"':'')+'>'+SHORT_NAMES[i]+' '+(feedback.delta[key]>0?'+':'')+feedback.delta[key]+'</span>':'').join('');
      return '<aside class="feedback" aria-label="工作反馈"><strong>工作反馈</strong><p>'+esc(feedback.text)+'</p>'+(deltas?'<div class="deltas">'+deltas+'</div>':'')+'</aside>';
    }
    function render(shouldScroll=false) {
      const sc=scenes[state.scene],chapter=sc.chapter;
      $('session-chapter').textContent='第'+NUM[chapter-1]+'章';
      $('session-label').textContent=state.scene==='ending'?'本次工作已完成':sc.task;
      $('progress-label').textContent='故事进度 '+sc.progress+'%';
      $('progress-track').setAttribute('aria-valuenow',sc.progress);
      $('progress-fill').style.width=sc.progress+'%';
      $('scene-photo').innerHTML=renderPhoto(state);
      $('chapter-nav').innerHTML='<p class="side-label">故事章节</p>'+CHAPTERS.map((c,i)=>'<button class="chapter-btn'+(chapter===i+1?' active':'')+'" data-action="chapter" data-index="'+i+'"'+(chapter===i+1?' aria-current="step"':'')+'><span class="chapter-n">'+(i+1)+'</span><span class="chapter-text"><strong><span class="chapter-prefix">第'+NUM[i]+'章</span> <span class="chapter-name">'+c.short+'</span></strong><small>'+(chapter===i+1?(state.scene==='ending'?'故事完成':'正在进行'):chapter>i+1?'前序章节':'后续章节')+'</small></span>'+(chapter>i+1?'<span class="chapter-check" aria-label="前序章节">✓</span>':'')+'</button>').join('');
      $('stats').innerHTML=STAT_KEYS.map((key,i)=>'<div class="stat"><div class="stat-line"><span>'+STAT_NAMES[i]+'</span><b>'+state.stats[key]+'</b><span class="unit">/100</span></div><div class="meter" role="meter" aria-label="'+STAT_NAMES[i]+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+state.stats[key]+'"><span style="width:'+state.stats[key]+'%"></span></div><span class="stat-label">'+(key==='guest'?'佐藤悠真 · ':'')+level(key,state.stats[key])+'</span></div>').join('');
      $('status-summary').textContent=state.scene==='ending'?'本次工作结算':'随选择变化';
      $('work-tasks').innerHTML=[['08:00','行程与礼物准备'],['10:00','节目录制与现场协调'],['11:25','午休与户外企划调整']].map((t,i)=>'<div class="work-task'+(chapter===i+1?' current':'')+'"><time>'+t[0]+'</time><span>'+t[1]+'</span></div>').join('');
      $('load-banner').hidden=!saved;
      if(saved)$('save-description').textContent='第'+NUM[scenes[saved.state.scene].chapter-1]+'章 · '+scenes[saved.state.scene].task;
      let html='<div class="scene-meta"><span class="chapter-tag">第'+NUM[chapter-1]+'章 · '+CHAPTERS[chapter-1].name+'</span><span class="location"><time>'+esc(sc.time)+'</time><span>／</span>'+esc(getValue(sc.place,state))+'</span></div>';
      if(state.scene==='ending') {
        const end=endingFor(state);
        html+='<span class="ending-label">'+end.label+' · 今日工作完成</span><h1 class="scene-title" id="scene-title" tabindex="-1">'+end.title+'</h1><p class="scene-subtitle">'+esc(sc.subtitle)+'</p>'+renderFeedback()+'<div class="story"><p>'+end.text+'</p><blockquote class="ending-quote">'+end.quote+'<span class="speaker" style="margin-top:8px">'+end.speaker+'</span></blockquote></div>';
        html+='<div class="ending-grid">'+STAT_KEYS.map((key,i)=>'<div><strong>'+STAT_NAMES[i]+'</strong><b>'+state.stats[key]+'</b>/ 100<br>'+level(key,state.stats[key])+'</div>').join('')+'</div>';
        html+='<div class="note"><h3>今天的工作手记</h3><p>'+end.note+'</p></div><div class="ending-actions"><button class="btn primary" data-action="restart-confirm">再过一次这一天</button><button class="btn" data-action="cafe-confirm">重玩第三章</button><button class="btn" data-action="save">保存当前进度</button></div>';
      } else {
        html+='<h1 class="scene-title" id="scene-title" tabindex="-1">'+esc(getValue(sc.title,state))+'</h1><p class="scene-subtitle">'+esc(sc.subtitle)+'</p>'+renderFeedback()+'<div class="rule" aria-hidden="true"></div><div class="story">'+sc.body(state).map(renderBlock).join('')+'</div>';
        const cs=available(state);
        html+='<section class="decision" aria-labelledby="decision-title"><div class="decision-head"><h2 id="decision-title">'+esc(sc.question||'下一幕，继续。')+'</h2><small>'+(cs.length>1?'点击一个方案，故事就会继续。':'准备好了，就进入下一幕。')+'</small></div><div class="choices'+(cs.length===1?' single':'')+'">'+cs.map((c,i)=>'<button class="choice" data-action="choice" data-index="'+i+'" data-scene="'+state.scene+'"><span class="choice-key" aria-hidden="true">'+(cs.length===1?'续':String.fromCharCode(65+i))+'</span><span class="choice-copy"><span class="choice-title">'+(cs.length>1?'<span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)">'+String.fromCharCode(65+i)+'：</span>':'')+esc(c.title)+'</span><span class="choice-desc">'+esc(c.desc)+'</span>'+(c.tag?'<span class="choice-tag">'+esc(c.tag)+'</span>':'')+'</span></button>').join('')+'</div></section>';
      }
      $('scene-inner').innerHTML=html;
      $('scene-inner').classList.remove('fade-in');
      void $('scene-inner').offsetWidth;
      $('scene-inner').classList.add('fade-in');
      document.title=(state.scene==='ending'?endingFor(state).label:'第'+NUM[chapter-1]+'章')+' · 相叶雅纪经纪人模拟器';
      if(shouldScroll) {
        $('scene-title').focus({preventScroll:true});
        $('game-area').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
      }
    }
    function toast(message) {clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>{$('toast').textContent='';},3300);}
    function showModal(title,body) {
      if(!$('modal').open)lastFocus=document.activeElement;
      $('modal-title').textContent=title;$('modal-body').innerHTML=body;
      $('modal').classList.remove('photos-modal');
      if(!$('modal').open)$('modal').showModal();
    }
    function closeModal(){if($('modal').open)$('modal').close();}
    $('modal').addEventListener('close',()=>{if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});});
    function confirmStart(start) {
      const chapter=scenes[start].chapter;
      showModal(chapter===1?'从第一章重新开始？':'从第'+NUM[chapter-1]+'章开始？','<p>这会替换页面里当前这一局的进度。已手动保存的存档会保留，除非你再次保存覆盖。</p>'+(start==='c3_route'?'<p>你将直接进入咖啡店的户外企划调整，A/B/C/D 四种方案都可以选择。</p>':'')+'<div class="modal-actions"><button class="btn" data-action="close">留在当前场景</button><button class="btn primary" data-action="start" data-start="'+start+'">开始这一章</button></div>');
    }
    function saveData(){return {game:'aiba-manager-note',version:1,savedAt:new Date().toISOString(),state:clone(state)};}
    function manualSave(){
      const data=saveData();
      try {localStorage.setItem(SAVE_KEY,JSON.stringify(data));saved=data;render();toast('当前进度已保存。下次打开可手动读取。');}
      catch(_){showModal('此浏览器无法保存本地进度','<p>游戏可以继续游玩。你可以导出一份进度文件，下次在菜单里导入。</p><div class="modal-actions"><button class="btn primary" data-action="export">导出当前进度</button><button class="btn" data-action="close">继续游玩</button></div>');}
    }
    function loadConfirm(){
      if(!saved){toast('还没有手动存档。');return;}
      showModal('读取手动存档？','<p>将回到第'+NUM[scenes[saved.state.scene].chapter-1]+'章的“'+esc(scenes[saved.state.scene].task)+'”。当前页面里的进度会被替换。</p><div class="modal-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="load">读取进度</button></div>');
    }
    function menu(){showModal('休息一下，再继续。','<p>你的选择只影响这局故事。页面不会自动保存或记录完整的选择历史。</p><div class="menu-grid"><button class="btn primary" data-action="save">手动保存进度</button><button class="btn" data-action="load-confirm"'+(!saved?' disabled':'')+'>读取手动存档</button><button class="btn" data-action="export">导出进度文件</button><button class="btn" data-action="import">导入进度文件</button></div><p class="muted">手动存档只保存当前场景、状态数值和分支所需的信息，留在你的浏览器或导出的文件中。</p><hr><div class="menu-grid"><button class="btn" data-action="restart-confirm">从第一章开始</button><button class="btn" data-action="cafe-confirm">直接体验第三章</button></div><button class="btn quiet" data-action="about">查看游玩说明</button>');}
    function about(){showModal('怎样度过这一天','<p>扮演虚构平行世界中的经纪人，从行程准备、节目录制，一路走到午休后的户外拍摄。点击 A/B/C/D 选项卡，就能推进故事。</p><p>四项状态从 0 到 100，会随选择变化：工作能力、相叶桑信赖度、节目组评价，以及与嘉宾佐藤悠真的关系。数值是游戏机制的表达。</p><p>结局由你的企划、执行、时间控制与沟通共同决定。没有倒计时，你可以慢慢想；收工后也能重新开始，体验其他分支。</p><p>手机上点开“经纪人档案”即可查看数值。四张 AI 场景配图已内嵌在这个 HTML 文件中，离线也能显示；相叶雅纪的公开人物照需要联网加载。人物照未能加载时，游戏仍可继续。</p><p class="muted">页面从全新第一章开始，不导入此前的游玩经历，也不自动存档。需要跨次继续时，请手动保存或导出进度。更换浏览器或文件位置时，建议使用导出／导入。所有剧情均属虚构，衔接与结局含本作续写。</p><div class="modal-actions"><button class="btn" data-action="photo-credits">查看照片与配图</button><button class="btn primary" data-action="close">开始做决定</button></div>');}
    function viewPhoto(key){
      if(!Object.hasOwn(SCENE_PHOTOS,key))return;
      const photo=SCENE_PHOTOS[key];
      showModal(photo.name,'<div class="photo-view"><div class="photo-cell photo-'+key+'" role="img" aria-label="'+photo.alt+'；AI 场景配图"></div></div><div class="photo-view-label"><b>'+photo.caption+'</b><small>AI 场景配图 · 已内嵌，可离线查看</small></div><div class="photo-gallery">'+Object.entries(SCENE_PHOTOS).map(([id,item])=>'<button class="gallery-item" data-action="view-photo" data-photo="'+id+'"'+(key===id?' aria-current="true"':'')+'><span class="gallery-image"><span class="photo-cell photo-'+id+'" aria-hidden="true"></span></span><b>'+item.name+'</b></button>').join('')+'</div><div class="modal-actions"><button class="btn" data-action="photo-credits">配图说明</button><button class="btn primary" data-action="close">回到故事</button></div>');
      $('modal').classList.add('photos-modal');
    }
    function photoCredits(){showModal('照片与场景配图','<p><strong>相叶雅纪人物照</strong><br>使用公开的人物宣传照，来自<a class="source-link" href="https://ikimonoworld.jp/" target="_blank" rel="noopener noreferrer">「いきもの超ワールド展」官方网站</a>；备用来源为<a class="source-link" href="https://web.familyclub.jp/s/jwb/artist/member/174" target="_blank" rel="noopener noreferrer">FAMILY CLUB web 人物页</a>。人物卡与对话头像均需联网加载，图片权益归原权利人所有。</p><p><strong>四张场景配图</strong><br>工作桌、演播厅、窗边咖啡与林间步道为本游戏生成的 AI 摄影风格配图，已内嵌在 HTML 文件中。它们用于表现虚构剧情氛围，并非真实录制或人物活动照片。</p><p class="muted">本作是非官方虚构互动故事，照片的使用不表示真实人物或图片来源方参与、认可本作。你可以点击章节照片，放大查看配图。</p><div class="modal-actions"><button class="btn" data-action="view-photo" data-photo="'+photoKeyFor(state)+'">查看当前场景配图</button><button class="btn primary" data-action="close">回到故事</button></div>');}
    function exportSave(){
      const blob=new Blob([JSON.stringify(saveData(),null,2)],{type:'application/json;charset=utf-8'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='相叶经纪人-当前进度.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('当前进度已导出。可在菜单中导入继续。');
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
      const action=button.dataset.action;
      if(action==='choice') {
        if(transitioning||button.dataset.scene!==state.scene)return;
        transitioning=true;
        try {const next=advance(state,Number(button.dataset.index));state=next.state;feedback=next.feedback;render(true);}
        finally {setTimeout(()=>{transitioning=false;},220);}
      } else if(action==='save'){manualSave();}
      else if(action==='menu'){menu();}
      else if(action==='close'){closeModal();}
      else if(action==='about'){about();}
      else if(action==='view-photo'){viewPhoto(button.dataset.photo);}
      else if(action==='photo-credits'){photoCredits();}
      else if(action==='chapter'){
        const i=Number(button.dataset.index),c=CHAPTERS[i];
        showModal('第'+NUM[i]+'章 · '+c.name,'<p>'+c.summary+'</p><p class="muted">从该章开始会替换本页当前进度。这里只提供章节梗概，不记录你的选择历史。</p><div class="modal-actions"><button class="btn" data-action="close">继续当前一局</button><button class="btn primary" data-action="chapter-confirm" data-start="'+c.start+'">从这章开始</button></div>');
      } else if(action==='restart-confirm'){confirmStart('c1_schedule');}
      else if(action==='cafe-confirm'){confirmStart('c3_route');}
      else if(action==='chapter-confirm'){confirmStart(button.dataset.start);}
      else if(action==='start'){
        const start=button.dataset.start;if(!CHAPTERS.some(c=>c.start===start))return;
        closeModal();state=fresh(start);feedback=null;render(true);toast(start==='c1_schedule'?'全新的一天，开始了。':'已进入全新的章节起点。');
      } else if(action==='load-confirm'){loadConfirm();}
      else if(action==='load'){
        try {state=validateSave(saved);feedback=null;closeModal();render(true);toast('已读取手动存档。');}catch(error){toast(error.message);}
      } else if(action==='export'){exportSave();}
      else if(action==='import'){$('import-file').value='';$('import-file').click();}
      else if(action==='import-apply'){
        if(!pendingImport)return;state=pendingImport;pendingImport=null;feedback=null;closeModal();render(true);toast('已导入进度，可以继续游玩。');
      }
    });
    $('import-file').addEventListener('change',async event=>{
      const file=event.target.files[0];if(!file)return;
      try {
        if(file.size>100000)throw new Error('文件过大，请选择本游戏导出的进度文件。');
        pendingImport=validateSave(JSON.parse(await file.text()));
        showModal('使用导入的进度？','<p>这份进度位于第'+NUM[scenes[pendingImport.scene].chapter-1]+'章：“'+esc(scenes[pendingImport.scene].task)+'”。它会替换本页当前这一局，不会覆盖浏览器里的手动存档。</p><div class="modal-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="import-apply">使用这份进度</button></div>');
      } catch(error){pendingImport=null;toast(error instanceof SyntaxError?'无法识别文件，请选择本游戏导出的 JSON 进度文件。':error.message);}
    });
    $('modal').addEventListener('click',event=>{
      if(event.target!==$('modal'))return;const rect=$('modal').getBoundingClientRect();
      if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();
    });
    document.addEventListener('keydown',event=>{
      if($('modal').open||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
      if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
      if(/^[a-d]$/i.test(event.key)){
        const buttons=document.querySelectorAll('button[data-action="choice"]'),index=event.key.toUpperCase().charCodeAt(0)-65;
        if(buttons[index]){event.preventDefault();buttons[index].click();}
      }
    });
    function handlePortraitError(image){
      const failed=image.getAttribute('src');portraitFailed.add(failed);
      const next=PORTRAIT_SOURCES.find(url=>!portraitFailed.has(url));
      if(next){image.src=next;return;}
      image.parentElement.classList.add('portrait-unavailable');
    }
    document.addEventListener('error',event=>{
      if(event.target.tagName==='IMG'&&event.target.dataset.portrait==='aiba')handlePortraitError(event.target);
    },true);
    document.querySelectorAll('img[data-portrait="aiba"]').forEach(image=>{
      if(image.complete&&image.naturalWidth===0)handlePortraitError(image);
    });
    if(window.matchMedia('(max-width:760px)').matches)$('status-panel').open=false;
    render();
    // Pure story functions are exposed only on explicit local QA URLs, never during normal play.
    if(location.hash==='#qa')Object.defineProperty(window,'__gameQA',{value:{fresh,advance,available,scenes,endingFor,validateSave,photoKeyFor,renderPhoto,getState:()=>clone(state)},writable:false});
  })();
  </script>
</body>
</html>
